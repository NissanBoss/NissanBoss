<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="NissanBoss. Deleted is not gone.">
  <style>
    /* Instrument Serif and IBM Plex Mono, both under the SIL Open Font
       License, cut down to the letters drawn here and carried inside the
       file: an image on GitHub cannot fetch a font from anywhere. */
    @font-face { font-family: 'Instrument Serif'; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-weight: 500; font-size: 12px; letter-spacing: 3px; fill: #ff2b2b; }
    .said { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 64px; }
    .faint { opacity: 0.45; }
    /* The bar goes over the word, and then the word comes back through
       it, the way text does from under a box drawn over it in a PDF. */
    .bar { fill: #ff2b2b; transform-box: fill-box; transform-origin: left center; animation: cover 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) 1.2s both; }
    .through { fill: #000; animation: through 0.9s ease-in 2.6s both; }
    @keyframes cover { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes through { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect width="860" height="260" rx="8" fill="#000"/>

  <text class="mono" x="48" y="50">NISSANBOSS</text>

  <!-- "gone." starts 301.4 pixels into the line and is 118.3 wide, as
       measured in the font itself; the bar overhangs it by six. -->
  <text class="said" x="48" y="156" fill="#ff2b2b">Deleted is not gone.</text>
  <rect class="bar" x="343.4" y="108" width="130.3" height="68"/>
  <text class="said through" x="349.4" y="156">gone.</text>

  <text class="mono faint" x="48" y="222">AIRING  DUNNAGE  WORKINGS  OUTTAKES  VERBATIM  BIRTHMARK</text>
</svg>
