<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="NissanBoss: what you give away without knowing">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .card { fill: #0d1117; stroke: #30363d; }
    .name { fill: #e6edf3; font-size: 22px; font-weight: 700; }
    .sub { fill: #7d8590; font-size: 15px; }
    .rule { stroke: #30363d; }
    .tag { fill: none; stroke: #d29922; }
    .label { fill: #d29922; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
    .said { fill: #e6edf3; font-size: 15px; }
    .tool { fill: #7d8590; font-size: 14px; }
    .end { fill: #7d8590; font-size: 14px; }
    .prompt { fill: #7d8590; font-size: 15px; }
    .cursor { fill: #d29922; }
    .row { animation: in 0.6s ease-out both; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect class="card" x="0.5" y="0.5" width="859" height="329" rx="12"/>

  <text class="name" x="40" y="54">NissanBoss</text>
  <text class="sub" x="40" y="80">what you give away without knowing</text>
  <line class="rule" x1="40" y1="102" x2="820" y2="102"/>

  <g class="row" style="animation-delay: 0.3s">
    <rect class="tag" x="40.5" y="122.5" width="86" height="24" rx="5"/>
    <text class="label" x="83.5" y="139" text-anchor="middle">SENSOR</text>
    <text class="said" x="146" y="140">Your phone signs every photo it takes, EXIF or not</text>
    <text class="tool" x="820" y="140" text-anchor="end">Birthmark</text>
  </g>
  <g class="row" style="animation-delay: 0.7s">
    <rect class="tag" x="40.5" y="156.5" width="86" height="24" rx="5"/>
    <text class="label" x="83.5" y="173" text-anchor="middle">SECRET</text>
    <text class="said" x="146" y="174">Your coding agent kept the key you pasted into it</text>
    <text class="tool" x="820" y="174" text-anchor="end">Verbatim</text>
  </g>
  <g class="row" style="animation-delay: 1.1s">
    <rect class="tag" x="40.5" y="190.5" width="86" height="24" rx="5"/>
    <text class="label" x="83.5" y="207" text-anchor="middle">PUSHED</text>
    <text class="said" x="146" y="208">Every file anybody ever deleted goes out with the push</text>
    <text class="tool" x="820" y="208" text-anchor="end">Airing</text>
  </g>
  <g class="row" style="animation-delay: 1.5s">
    <rect class="tag" x="40.5" y="224.5" width="86" height="24" rx="5"/>
    <text class="label" x="83.5" y="241" text-anchor="middle">TELLS</text>
    <text class="said" x="146" y="242">Your anonymous code carries names only your own has</text>
    <text class="tool" x="820" y="242" text-anchor="end">Accent</text>
  </g>
  <g class="row" style="animation-delay: 1.9s">
    <rect class="tag" x="40.5" y="258.5" width="86" height="24" rx="5"/>
    <text class="label" x="83.5" y="275" text-anchor="middle">TYPED</text>
    <text class="said" x="146" y="276">Forty files on your machine wrote down what you typed</text>
    <text class="tool" x="820" y="276" text-anchor="end">Hearsay</text>
  </g>

  <g class="row" style="animation-delay: 2.5s">
    <text class="end" x="40" y="312">Nothing was changed, and nothing was sent anywhere.</text>
    <!-- The same line again, unseen, so the cursor lands right after it in whatever font draws it. -->
    <text class="end blink" x="40" y="312"><tspan fill="none">Nothing was changed, and nothing was sent anywhere.</tspan><tspan class="cursor" dx="7">&#9608;</tspan></text>
  </g>
</svg>
